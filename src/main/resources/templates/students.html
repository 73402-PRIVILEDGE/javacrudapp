
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student CRUD Application</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px;
               margin: 40px auto; padding: 0 20px; background: #f4f6f8; }
        h1 { color: #17365d; }
        form, .student { background: white; padding: 16px;
                         margin: 12px 0; border-radius: 8px; }
        input { padding: 9px; margin: 5px; max-width: 100%; }
        button { padding: 9px 14px; cursor: pointer; }
        .delete { background: #b42318; color: white; border: 0; }
        .message { color: #18753b; }
    </style>
</head>
<body>
    <h1>Student Management</h1>
    <p>Java Spring Boot CRUD Application</p>

    <p class="message" th:text="${message}"></p>

    <h2>Add a student</h2>
    <form action="/students" method="post">
        <input type="text" name="name" placeholder="Student name" required>
        <input type="email" name="email" placeholder="Student email" required>
        <button type="submit">Add Student</button>
    </form>

    <h2>Student List</h2>
    <p th:if="${#lists.isEmpty(students)}">No students yet. Add one above.</p>

    <div class="student" th:each="student : ${students}">
        <form th:action="@{/students/{id}/update(id=${student.id})}"
              method="post">
            <label>Name:
                <input type="text" name="name" th:value="${student.name}" required>
            </label>
            <label>Email:
                <input type="email" name="email" th:value="${student.email}" required>
            </label>
            <button type="submit">Update</button>
        </form>

        <form th:action="@{/students/{id}/delete(id=${student.id})}"
              method="post">
            <button class="delete" type="submit">Delete</button>
        </form>
    </div>
</body>
</html>
